<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { max-width: 500px; margin: 50px auto; padding: 20px; }
        h1 { text-align: center; }
        .form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .form input[type="text"] { flex: 1; min-width: 200px; padding: 10px; font-size: 16px; }
        .form input[type="date"] { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
        li.completed .todo-text { text-decoration: line-through; color: #888; }
        .todo-text { flex: 1; min-width: 100px; }
        .due-date { font-size: 14px; color: #666; }
        .due-date.overdue { color: #d00; font-weight: bold; }
        .due-date.completed { color: #888; }
        .delete { background: #ff4444; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    <div class="form">
        <input type="text" id="todoInput" placeholder="Enter todo...">
        <input type="date" id="dueDateInput">
        <button onclick="addTodo()">Add</button>
    </div>
    <ul id="todoList"></ul>

    <script>
        function getTomorrowDate() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return tomorrow.toISOString().split('T')[0];
        }

        document.getElementById('dueDateInput').value = getTomorrowDate();

        function isOverdue(dueDate) {
            if (!dueDate) return false;
            const today = new Date().toISOString().split('T')[0];
            return dueDate < today;
        }

        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date + 'T00:00:00');
            return d.toLocaleDateString();
        }

        async function loadTodos() {
            const res = await fetch('/todos');
            const todos = await res.json();
            const list = document.getElementById('todoList');
            list.innerHTML = todos.map(todo => {
                const overdue = !todo.completed && isOverdue(todo.dueDate);
                const dueDateClass = todo.completed ? 'completed' : (overdue ? 'overdue' : '');
                return `
                    <li class="${todo.completed ? 'completed' : ''}">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                               onchange="toggleTodo(${todo.id}, this.checked)">
                        <span class="todo-text">${todo.text}</span>
                        ${todo.dueDate ? `<span class="due-date ${dueDateClass}">Due: ${formatDate(todo.dueDate)}</span>` : ''}
                        <button class="delete" onclick="deleteTodo(${todo.id})">Delete</button>
                    </li>
                `;
            }).join('');
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            const dueDateInput = document.getElementById('dueDateInput');
            if (!input.value.trim()) return;
            await fetch('/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: input.value,
                    dueDate: dueDateInput.value || getTomorrowDate()
                })
            });
            input.value = '';
            dueDateInput.value = getTomorrowDate();
            loadTodos();
        }

        async function toggleTodo(id, completed) {
            await fetch(`/todos/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed })
            });
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(`/todos/${id}`, { method: 'DELETE' });
            loadTodos();
        }

        loadTodos();
    </script>
</body>
</html>
